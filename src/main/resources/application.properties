spring.application.name=gestion-transporte
server.port=8081
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.error.whitelabel.enabled=false

spring.datasource.url=jdbc:mysql://localhost:3306/transporte_interprovincial?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.thymeleaf.cache=false
spring.messages.basename=mensajes
spring.messages.encoding=UTF-8
spring.web.locale=es_PE
spring.web.locale-resolver=fixed
