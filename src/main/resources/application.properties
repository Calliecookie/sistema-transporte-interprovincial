spring.application.name=gestion-transporte
server.port=8081
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.error.whitelabel.enabled=false

spring.datasource.url=jdbc:mysql://localhost:3306/transporte_interprovincial?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.thymeleaf.cache=false
spring.messages.basename=mensajes
spring.messages.encoding=UTF-8
spring.web.locale=es_PE
spring.web.locale-resolver=fixed

factiliza.url-base=${FACTILIZA_URL_BASE:https://api.factiliza.com/v1}
factiliza.token=${FACTILIZA_TOKEN:}
factiliza.segundos-espera=${FACTILIZA_SEGUNDOS_ESPERA:8}

spring.mail.host=${CORREO_SERVIDOR:}
spring.mail.port=${CORREO_PUERTO:587}
spring.mail.username=${CORREO_USUARIO:}
spring.mail.password=${CORREO_CONTRASENA:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

aplicacion.url-publica=${URL_PUBLICA:http://localhost:8081}
aplicacion.correo-remitente=${CORREO_REMITENTE:}
aplicacion.minutos-vigencia-enlace=30
