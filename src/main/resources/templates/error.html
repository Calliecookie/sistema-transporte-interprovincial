<!DOCTYPE html>
<html lang="es-PE" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: cabecera('Aviso')}"></head>
<body>
<main class="pagina-error">
    <div class="tarjeta-error">
        <div class="codigo-error" th:text="${codigo != null ? codigo : (status != null ? status : 500)}">500</div>
        <h1 th:text="${titulo != null ? titulo : 'Ocurrió un problema'}">Ocurrió un problema</h1>
        <p th:text="${mensaje != null ? mensaje : 'No fue posible completar la operación. Inténtelo nuevamente en unos momentos.'}">Mensaje</p>
        <a class="boton boton-primario" th:href="@{/}">Ir al inicio</a>
    </div>
</main>
</body>
</html>
