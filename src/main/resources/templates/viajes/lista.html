<!DOCTYPE html>
<html lang="es-PE" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: cabecera('Viajes')}"></head>
<body>
<div class="estructura">
    <aside th:replace="~{fragmentos/base :: menu('viajes')}"></aside>
    <main class="contenido">
        <header th:replace="~{fragmentos/base :: encabezado('Programación de viajes')}"></header>
        <div th:replace="~{fragmentos/base :: mensajes}"></div>

        <section class="panel">
            <div class="panel-cabecera">
                <div>
                    <h2>Viajes registrados</h2>
                    <p th:text="${pagina.totalElements + ' viajes encontrados'}"></p>
                </div>
                <a class="boton boton-dorado" th:href="@{/viajes/nuevo}">
                    <th:block th:replace="~{fragmentos/iconos :: mas}"></th:block>Programar viaje
                </a>
            </div>

            <form class="filtros" method="get" th:action="@{/viajes}">
                <div class="campo">
                    <label for="desde">Salida desde</label>
                    <input type="date" id="desde" name="desde" th:value="${desde}">
                </div>
                <div class="campo">
                    <label for="hasta">Salida hasta</label>
                    <input type="date" id="hasta" name="hasta" th:value="${hasta}">
                </div>
                <div class="campo">
                    <label for="rutaId">Ruta</label>
                    <select id="rutaId" name="rutaId">
                        <option value="">Todas</option>
                        <option th:each="r : ${rutas}" th:value="${r.id}" th:text="${r.descripcion}" th:selected="${rutaId != null and rutaId == r.id}"></option>
                    </select>
                </div>
                <div class="campo">
                    <label for="estado">Estado</label>
                    <select id="estado" name="estado">
                        <option value="">Todos</option>
                        <option th:each="e : ${estados}" th:value="${e.name()}" th:text="${e.etiqueta}" th:selected="${estado == e}"></option>
                    </select>
                </div>
                <div class="filtros-acciones">
                    <button class="boton boton-primario" type="submit">Buscar</button>
                    <a class="boton boton-secundario" th:href="@{/viajes}">Limpiar</a>
                </div>
            </form>

            <div class="contenedor-tabla" th:if="${!pagina.empty}">
                <table class="tabla">
                    <thead>
                        <tr><th>N.°</th><th>Ruta</th><th>Salida</th><th>Llegada</th><th>Bus</th><th>Conductor</th><th class="derecha">Precio</th><th class="centro">Libres</th><th>Estado</th><th></th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="v : ${pagina.content}">
                            <td th:text="${v.id}"></td>
                            <td><strong th:text="${v.ruta.descripcion}"></strong></td>
                            <td th:text="${#temporals.format(v.fechaSalida, 'dd/MM/yyyy HH:mm')}"></td>
                            <td th:text="${#temporals.format(v.fechaLlegada, 'dd/MM/yyyy HH:mm')}"></td>
                            <td th:text="${v.bus.placa}"></td>
                            <td th:text="${v.conductor.nombreCompleto}"></td>
                            <td class="derecha" th:text="${'S/ ' + #numbers.formatDecimal(v.precio, 1, 'COMMA', 2, 'POINT')}"></td>
                            <td class="centro" th:text="${v.asientosLibres + '/' + v.asientosTotales}"></td>
                            <td><span class="etiqueta" th:classappend="${'estado-' + v.estado.name().toLowerCase()}" th:text="${v.estado.etiqueta}"></span></td>
                            <td><a class="boton boton-secundario boton-chico" th:href="@{/viajes/{id}(id=${v.id})}">Ver detalle</a></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <p class="vacio" th:if="${pagina.empty}">No se encontraron viajes con los datos indicados.</p>
            <div th:replace="~{fragmentos/paginacion :: paginacion(${pagina}, '/viajes', ${parametros})}"></div>
        </section>
    </main>
</div>
</body>
</html>
