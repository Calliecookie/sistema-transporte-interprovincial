<!DOCTYPE html>
<html lang="es-PE" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: cabecera('Pasajes')}"></head>
<body>
<div class="estructura">
    <aside th:replace="~{fragmentos/base :: menu('pasajes')}"></aside>
    <main class="contenido">
        <header th:replace="~{fragmentos/base :: encabezado('Pasajes vendidos')}"></header>
        <div th:replace="~{fragmentos/base :: mensajes}"></div>

        <section class="panel">
            <div class="panel-cabecera">
                <div>
                    <h2>Pasajes emitidos</h2>
                    <p th:text="${pagina.totalElements + ' pasajes encontrados'}"></p>
                </div>
            </div>

            <form class="filtros" method="get" th:action="@{/pasajes}">
                <div class="campo">
                    <label for="dni">DNI del pasajero</label>
                    <input type="text" id="dni" name="dni" th:value="${dni}" maxlength="8" inputmode="numeric" placeholder="Ej. 45218790">
                </div>
                <div class="campo">
                    <label for="codigo">Código del pasaje</label>
                    <input type="text" id="codigo" name="codigo" th:value="${codigo}" placeholder="Ej. PJ-0000">
                </div>
                <div class="campo">
                    <label for="estado">Estado</label>
                    <select id="estado" name="estado">
                        <option value="">Todos</option>
                        <option th:each="e : ${estados}" th:value="${e.name()}" th:text="${e.etiqueta}" th:selected="${estado == e}"></option>
                    </select>
                </div>
                <div class="campo">
                    <label for="desde">Vendido desde</label>
                    <input type="date" id="desde" name="desde" th:value="${desde}">
                </div>
                <div class="campo">
                    <label for="hasta">Vendido hasta</label>
                    <input type="date" id="hasta" name="hasta" th:value="${hasta}">
                </div>
                <div class="filtros-acciones">
                    <button class="boton boton-primario" type="submit">Buscar</button>
                    <a class="boton boton-secundario" th:href="@{/pasajes}">Limpiar</a>
                </div>
            </form>

            <div class="contenedor-tabla" th:if="${!pagina.empty}">
                <table class="tabla">
                    <thead>
                        <tr><th>Código</th><th>Fecha de venta</th><th>Pasajero</th><th>Ruta</th><th class="centro">Asiento</th><th class="derecha">Monto</th><th>Pago</th><th>Estado</th><th></th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${pagina.content}">
                            <td><strong th:text="${p.codigo}"></strong></td>
                            <td th:text="${#temporals.format(p.fechaVenta, 'dd/MM/yyyy HH:mm')}"></td>
                            <td th:text="${p.reserva.pasajero.nombreCompleto}"></td>
                            <td th:text="${p.reserva.viaje.ruta.descripcion}"></td>
                            <td class="centro" th:text="${p.reserva.asiento.numero}"></td>
                            <td class="derecha" th:text="${'S/ ' + #numbers.formatDecimal(p.precio, 1, 'COMMA', 2, 'POINT')}"></td>
                            <td th:text="${p.metodoPago.etiqueta}"></td>
                            <td><span class="etiqueta" th:classappend="${'estado-' + p.estado.name().toLowerCase()}" th:text="${p.estado.etiqueta}"></span></td>
                            <td><a class="boton boton-secundario boton-chico" th:href="@{/pasajes/{id}(id=${p.id})}">Ver pasaje</a></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <p class="vacio" th:if="${pagina.empty}">No se encontraron pasajes con los datos indicados.</p>
            <div th:replace="~{fragmentos/paginacion :: paginacion(${pagina}, '/pasajes', ${parametros})}"></div>
        </section>
    </main>
</div>
</body>
</html>
